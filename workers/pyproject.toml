[project]
name = "workers"
version = "0.1.0"
description = "Nodos worker: consumen sus colas por prioridad, procesan multimedia con ffmpeg o APIs externas y reportan cada cambio de estado al coordinador."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "boto3>=1.34",
    "pydantic-settings>=2.4",
    "psutil>=5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "moto[sqs,dynamodb,s3,server]>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "websockets>=12",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workers"]

# ruff 0.16 (el de uv.lock) ordena imports por defecto y, sin esto, toma
# `shared` como tercero. Así queda el mismo agrupamiento que usa el
# coordinador: stdlib, terceros, `shared`, y después el paquete propio.
[tool.ruff.lint.isort]
known-first-party = ["shared", "workers"]
