[project]
name = "shared"
version = "0.1.0"
description = "Contratos de dominio compartidos: routing, estados, mensajes SQS, modelos de DynamoDB/S3 y contratos REST."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Layout estándar src/-like: los módulos viven en shared/shared/ (junto a este
# pyproject.toml está el paquete "shared" de verdad). Antes esto era un layout
# plano con un remapeo `sources` en el build de hatchling, pero ese remapeo no
# se refleja en el install editable (`uv sync`/`pip install -e`): el .pth que
# genera apunta al propio directorio shared/ en vez de a su padre, y
# `import shared` sólo resolvía por accidente vía el cwd-on-path de Python.
# Con el layout anidado, hatchling detecta el paquete solo y el editable
# install funciona sin trucos.
[tool.hatch.build.targets.wheel]
packages = ["shared"]
