[project]
name = "coordinator"
version = "0.1.0"
description = "Nodo coordinador: planifica sub-tareas, encola trabajo, aplica el barrier de cierre de casos y expone la API REST del panel."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.34",
    "pydantic-settings>=2.4",
    "python-ulid>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "moto[sqs,dynamodb,s3]>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coordinator"]
